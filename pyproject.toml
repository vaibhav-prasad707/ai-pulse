[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pulse"
version = "0.1.0"
description = "Emerging AI Tool Update Dashboard with LLM-powered summarization and RAG chat"
requires-python = ">=3.11"
authors = [{name = "AI Pulse Team"}]
license = {text = "MIT"}

dependencies = [
    "anthropic>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "feedparser>=6.0.10",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
    "streamlit>=1.28.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "python-dateutil>=2.8.2",
    "fuzzywuzzy[speedup]>=0.18.0",
    "python-levenshtein>=0.21.1",
    "pgvector>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
